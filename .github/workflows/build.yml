# Runs the tests and builds the app on every push and pull request, so a
# change that breaks either is caught before it reaches a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test and build
        # Both architectures, like a release, so an Intel-only break shows up too.
        run: ARCHS="arm64 x86_64" ./build.sh
